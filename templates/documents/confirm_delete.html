{% extends 'base.html' %}

{% block title %}Delete Document{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm" style="border-radius: 12px; overflow: hidden;">
                <div class="card-body p-5 text-center">
                    <div class="mb-4 text-danger">
                        <i class="fas fa-exclamation-triangle fa-4x"></i>
                    </div>
                    <h3 class="font-weight-bold mb-3">Delete Document</h3>
                    <p class="text-muted mb-4">Are you sure you want to delete the document <strong>"{{ object.title }}"</strong>? This action cannot be undone.</p>
                    
                    <form method="POST">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-3">
                            <a href="{% url 'documents:list' %}" class="btn btn-light px-4 mr-2" style="border-radius: 8px;">Cancel</a>
                            <button type="submit" class="btn btn-danger px-4" style="border-radius: 8px;">Yes, Delete</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
