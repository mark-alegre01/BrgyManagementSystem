<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    @page { size: A4; margin: 1in; }
    body { font-family: sans-serif; font-size: 11pt; line-height: 1.5; color: black; }
    img { max-width: 100%; height: auto; }
    table { border-collapse: collapse; width: 100%; margin: 0; }
    td, th { border: 1px solid #ced4da; padding: 3px 5px; }
    th { font-weight: bold; text-align: left; background-color: #f1f3f5; }
    p { margin-bottom: 1em; margin-top: 0; }
    h1, h2, h3 { margin-top: 1.5em; margin-bottom: 0.5em; }
</style>
</head>
<body>
    {{ document.content|safe }}
</body>
</html>
