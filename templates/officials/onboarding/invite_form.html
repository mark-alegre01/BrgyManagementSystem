{% extends 'base.html' %}

{% block title %}Invite Official - Barangay Management System{% endblock %}

{% block content %}
<div class="page-header">
    <div class="page-title">
        <h1>Invite Official</h1>
        <span>Send an onboarding link to a new barangay official</span>
    </div>
</div>

<div class="card" style="max-width: 600px; margin: 0 auto;">
    <form method="POST" class="modern-form">
        {% csrf_token %}
        <div class="form-section">
            <h3 style="margin-top: 0;">Official Details</h3>

            <div class="form-group pb-3">
                <label>First Name*</label>
                <input type="text" name="first_name" class="form-control" required placeholder="e.g. Juan">
            </div>

            <div class="form-group pb-3">
                <label>Last Name*</label>
                <input type="text" name="last_name" class="form-control" required placeholder="e.g. Dela Cruz">
            </div>

            <div class="form-group pb-3">
                <label>Position*</label>
                <select name="position" class="form-control" required>
                    <option value="">Select Position...</option>
                    {% for code, label in positions %}
                    <option value="{{ code }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group pb-3">
                <label>Mobile Number*</label>
                <input type="text" name="phone_number" class="form-control" required placeholder="09xxxxxxxxx">
                <small class="text-muted">An OTP will be sent to this number upon dual approval.</small>
            </div>

        </div>

        <div class="form-footer">
            <button type="submit" class="btn btn-primary btn-lg w-100">
                <i class="fas fa-paper-plane"></i> Generate Invite Link
            </button>
        </div>
    </form>
</div>

<style>
    .modern-form {
        padding: 30px;
    }

    .form-section h3 {
        font-size: 16px;
        color: var(--primary);
        margin-bottom: 20px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 8px;
    }

    .pb-3 {
        padding-bottom: 1rem;
    }

    .w-100 {
        width: 100%;
    }
</style>
{% endblock %}
