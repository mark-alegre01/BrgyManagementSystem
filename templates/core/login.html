{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Barangay Management System</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      margin: 0;
    }

    .login-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .login-logo-container {
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
      background: white;
      border-radius: 50%;
      padding: 5px;
      box-shadow: 0 0 20px rgba(79, 70, 229, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .login-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .login-card h2 {
      font-size: 28px;
      margin-bottom: 8px;
      color: white;
    }

    .login-card p {
      color: var(--text-muted);
      margin-bottom: 30px;
    }

    .login-tabs {
      display: flex;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }

    .login-tab {
      flex: 1;
      padding: 12px 16px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 10px;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .login-tab:hover {
      color: white;
    }

    .login-tab.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
    }

    .login-tab i {
      font-size: 16px;
    }

    .login-content {
      display: none;
    }

    .login-content.active {
      display: block;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
    }

    .alert {
      margin-bottom: 20px;
      font-size: 14px;
      padding: 12px;
      border-radius: 10px;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: var(--text-muted);
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider span {
      padding: 0 16px;
    }

    .qr-scanner-container {
      background: rgba(15, 23, 42, 0.5);
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: 30px 20px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .qr-scanner-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .qr-camera-view {
      width: 100%;
      max-width: 200px;
      height: 200px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      border: 3px solid var(--primary);
    }

    .qr-camera-view::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        linear-gradient(90deg, transparent 49%, rgba(79, 70, 229, 0.3) 50%, transparent 51%),
        linear-gradient(0deg, transparent 49%, rgba(79, 70, 229, 0.3) 50%, transparent 51%);
      background-size: 20px 20px;
    }

    .qr-camera-view .scan-line {
      position: absolute;
      width: 80%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      animation: scan 2s ease-in-out infinite;
      box-shadow: 0 0 10px var(--primary);
    }

    @keyframes scan {

      0%,
      100% {
        top: 20%;
      }

      50% {
        top: 80%;
      }
    }

    .qr-camera-icon {
      font-size: 60px;
      color: var(--primary);
      z-index: 1;
    }

    .qr-instructions {
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
    }

    .qr-instructions strong {
      color: white;
    }

    .philsys-branding {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
      padding: 12px;
      background: rgba(79, 70, 229, 0.1);
      border-radius: 10px;
      border: 1px solid rgba(79, 70, 229, 0.2);
    }

    .philsys-logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 18px;
    }

    .philsys-text {
      text-align: left;
    }

    .philsys-text span {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
    }

    .philsys-text strong {
      color: white;
      font-size: 14px;
    }

    .psn-input-group {
      position: relative;
    }

    .psn-input-group .form-control {
      padding-left: 44px;
      font-family: 'Courier New', monospace;
      letter-spacing: 2px;
      font-size: 18px;
      text-transform: uppercase;
    }

    .psn-input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 16px;
    }

    .login-with-qr-btn {
      width: 100%;
      margin-bottom: 16px;
    }

    .manual-entry-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      transition: var(--transition);
    }

    .manual-entry-toggle:hover {
      color: white;
      background: rgba(255, 255, 255, 0.05);
    }

    .manual-entry-toggle i {
      transition: var(--transition);
    }

    .manual-entry-toggle.collapsed i {
      transform: rotate(-90deg);
    }

    .manual-entry-content {
      display: none;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .manual-entry-content.show {
      display: block;
    }

    .d-none {
      display: none !important;
    }

    .mr-2 {
      margin-right: 0.5rem;
    }
  </style>
</head>

<body>
  <div class="login-card">
    <div class="login-logo-container">
      <img src="{% static 'images/logo.png' %}" alt="Logo" class="login-logo-img">
    </div>
    <h2>SICO-SICO</h2>
    <p>Barangay Management System</p>

    {% if messages %}
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">
      {{ message }}
    </div>
    {% endfor %}
    {% endif %}

    <div id="credentials-content">
      <form method="POST">
        {% csrf_token %}
        <div class="form-group">
          <label>Role</label>
          <select name="role" class="form-control" required autofocus>
            <option value="">Select role</option>
            <option value="captain">Barangay Captain</option>
            <option value="secretary">Secretary</option>
            <option value="treasurer">Treasurer</option>
            <option value="bhw">Barangay BHW</option>
          </select>
        </div>

        <div class="form-group">
          <label>Login Method</label>
          <div id="login-method-buttons" class="login-tabs" style="margin-bottom: 0;">
            <button type="button" id="btn-method-password" class="login-tab active" data-method="password">
              <i class="fas fa-key"></i>
              <span>Password</span>
            </button>
            <button type="button" id="btn-method-biometric" class="login-tab" data-method="biometric">
              <i class="fas fa-fingerprint"></i>
              <span>Fingerprint</span>
            </button>
          </div>
          <input type="hidden" id="login-method" name="login_method" value="password">
        </div>

        <div id="password-credentials">
          <div class="form-group">
            <label>Password</label>
            <input id="password-input" type="password" name="password" class="form-control" placeholder="Enter password" required>
          </div>
          <button type="submit" id="btn-password-login" class="btn btn-primary login-btn">
            <i class="fas fa-sign-in-alt"></i>
            Log In
          </button>
        </div>

        <div id="biometric-credentials" style="display: none;">
          <div class="qr-scanner-container" style="border-style: solid; border-color: #10b981;">
            <div class="qr-scanner-placeholder">
              <div class="qr-camera-view" style="border-color: #10b981;">
                <i class="fas fa-fingerprint qr-camera-icon" style="color: #10b981;"></i>
                <div class="scan-line" style="background: linear-gradient(90deg, transparent, #10b981, transparent); box-shadow: 0 0 10px #10b981;"></div>
              </div>
              <p class="qr-instructions" id="biometric-status">
                <strong>Ready to Scan</strong><br>
                Place your registered finger on the ZK9500 sensor
              </p>
            </div>
          </div>

          <button type="button" id="btn-biometric-login" class="btn btn-primary login-btn" style="background: #10b981; border-color: #059669;">
            <i class="fas fa-play mr-2"></i>
            Start Biometric Scan
          </button>
          
          <div id="biometric-error" class="alert alert-error mt-3 d-none"></div>
        </div>
      </form>

      <div style="margin-top: 24px; text-align: center;">
        <a href="{% url 'signup' %}" style="color: inherit; text-decoration: underline;">Create an account</a>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const loginMethodHidden = document.getElementById('login-method');
      const methodPasswordBtn = document.getElementById('btn-method-password');
      const methodBiometricBtn = document.getElementById('btn-method-biometric');
      const passwordCredentials = document.getElementById('password-credentials');
      const biometricCredentials = document.getElementById('biometric-credentials');
      const passwordInput = document.getElementById('password-input');
      const btnBio = document.getElementById('btn-biometric-login');
      const bioStatus = document.getElementById('biometric-status');
      const bioError = document.getElementById('biometric-error');
      const roleSelect = document.querySelector('select[name="role"]');

      let biometricPollInterval = null;
      let biometricTimeout = null;

      function resetBiometricUI(message) {
        if (biometricPollInterval) {
          clearInterval(biometricPollInterval);
          biometricPollInterval = null;
        }
        if (biometricTimeout) {
          clearTimeout(biometricTimeout);
          biometricTimeout = null;
        }

        if (btnBio) {
          btnBio.disabled = false;
          btnBio.innerHTML = '<i class="fas fa-play mr-2"></i> Start Biometric Scan';
        }
        if (bioStatus) {
          bioStatus.innerHTML = '<strong>Ready to Scan</strong><br>Place your registered finger on the ZK9500 sensor';
        }
        if (bioError) {
          if (message) {
            bioError.textContent = message;
            bioError.classList.remove('d-none');
          } else {
            bioError.classList.add('d-none');
          }
        }
      }

      function applyLoginMethod() {
        const method = loginMethodHidden ? loginMethodHidden.value : 'password';
        if (method ==   = 'biometric') {
          if (passwordCredentials) passwordCredentials.style.display = 'none';
          if (biometricCredentials) biometricCredentials.style.display = 'block';
          if (passwordInput) passwordInput.required = false;
        } else {
          if (passwordCredentials) passwordCredentials.style.display = 'block';
          if (biometricCredentials) biometricCredentials.style.display = 'none';
          if (passwordInput) passwordInput.required = true;
          resetBiometricUI();
        }
      }

      function setLoginMethod(method) {
        if (loginMethodHidden) loginMethodHidden.value = method;
        if (methodPasswordBtn && methodBiometricBtn) {
          methodPasswordBtn.classList.toggle('active', method ==   = 'password');
          methodBiometricBtn.classList.toggle('active', method ==   = 'biometric');
        }
        applyLoginMethod();
      }

      if (methodPasswordBtn) {
        methodPasswordBtn.addEventListener('click', () => setLoginMethod('password'));
      }
      if (methodBiometricBtn) {
        methodBiometricBtn.addEventListener('click', () => setLoginMethod('biometric'));
      }

      // Initialize default
      setLoginMethod('password');

      if (btnBio) {
        btnBio.addEventListener('click', function() {
          const selectedRole = roleSelect ? (roleSelect.value || '').trim() : '';
          if (!selectedRole) {
            resetBiometricUI('Please select a role first.');
            return;
          }

          resetBiometricUI();

          btnBio.disabled = true;
          btnBio.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Initializing Scanner...';
          bioError.classList.add('d-none');

          fetch("/biometric-login-start/", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ role: selectedRole }),
          })
            .then(async response => {
              const data = await response.json();
              if (response.ok) {
                btnBio.innerHTML = '<i class="fas fa-fingerprint fa-pulse mr-2"></i> Waiting for Finger...';
                bioStatus.innerHTML = '<strong>Scanner Active</strong><br>Please place your finger on the sensor';

                checkBiometricStatus();

                biometricTimeout = setTimeout(() => {
                  resetBiometricUI('Scanner session expired. Try again.');
                }, 30000);
              } else {
                throw new Error(data.message || 'Failed to start biometric service');
              }
            })
            .catch(error => {
              btnBio.disabled = false;
              btnBio.innerHTML = '<i class="fas fa-play mr-2"></i> Start Biometric Scan';
              bioError.textContent = error.message;
              bioError.classList.remove('d-none');
            });
        });
      }

      function checkBiometricStatus() {
        biometricPollInterval = setInterval(() => {
          fetch("/biometric-status-check/")
            .then(response => response.json())
            .then(data => {
              if (data.status ==   = 'authenticated') {
                resetBiometricUI();
                window.location.href = "{% url 'dashboard' %}";
              } else if (data.status ==   = 'failed') {
                resetBiometricUI(data.reason || 'Finger not recognized. Try again.');
                btnBio.disabled = false;
                btnBio.innerHTML = '<i class="fas fa-play mr-2"></i> Start Biometric Scan';
                bioStatus.innerHTML = '<strong>Scan Failed</strong><br>' + (data.reason || 'Finger not recognized. Try again.');
                if (data.reason) {
                  bioError.textContent = data.reason;
                  bioError.classList.remove('d-none');
                }
              }
            });
        }, 2000);
      }
    });
  </script>
</body>

</html>
