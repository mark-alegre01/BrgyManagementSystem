; PlatformIO Project Configuration File
;
;   Build options: build flags, build filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; https://docs.platformio.org/page/projectconf.html
;
; --- If upload fails: "Failed to connect ... No serial data received" ---
; 1. Close Serial Monitor, any other terminal using COM5, and Arduino IDE.
; 2. Use a USB cable that supports DATA (not charge-only).
; 3. Put the board in download mode: hold BOOT (IO0), tap RESET (EN), release RESET,
;    keep holding BOOT until "Connecting..." / "Writing" appears, then release BOOT.
; 4. Run: pio device list   (confirm COM port; change upload_port below if needed)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

; Set to your port from "pio device list" (Windows: COMx). Comment out to auto-detect.
; upload_port = COM5

; 115200 is reliable for CP210x/CH340 initial sync; raise to 460800 if uploads are stable.
upload_speed = 115200

; More bootloader sync attempts (helps when auto-reset is flaky)
upload_flags =
    --connect-attempts=30

; Brief delay after opening port (some USB-serial bridges need it)
board_upload.wait_for_upload_port = yes

lib_deps = 
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    tzapu/WiFiManager @ ^2.0.17
